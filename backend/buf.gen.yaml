version: v1

plugins:
  # This plugin generates the Go protobuf message types.
  - plugin: buf.build/protocolbuffers/go:v1.31.0
    out: rpc
    opt:
      - paths=source_relative

  # This plugin generates the Go gRPC service stubs.
  - plugin: buf.build/grpc/go:v1.3.0
    out: rpc
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true

