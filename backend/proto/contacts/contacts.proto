syntax = "proto3";

package contacts;

// The go_package option must match the module path from go.mod.
option go_package = "CRM/backend/rpc";

import "google/protobuf/timestamp.proto";
// Import the annotations for gRPC-Gateway.
import "google/api/annotations.proto";

// ContactService provides APIs for managing contacts.
service ContactService {
  // CreateContact creates a new contact in the system.
  rpc CreateContact(CreateContactRequest) returns (CreateContactResponse) {
    // This annotation maps the RPC to an HTTP endpoint.
    option (google.api.http) = {
      post: "/api/v1/contacts"
      body: "*"
    };
  }
}

// Contact represents a single contact entity in the CRM.
message Contact {
  // The unique identifier for the contact (UUID).
  string id = 1;
  // The first name of the contact.
  string first_name = 2;
  // The last name of the contact.
  string last_name = 3;
  // The email address of the contact. Should be unique.
  string email = 4;
  // The phone number of the contact.
  string phone = 5;
  // The ID of the user who owns or is responsible for this contact.
  string owner_id = 6;
  // The timestamp when the contact was created.
  google.protobuf.Timestamp created_at = 7;
  // The timestamp when the contact was last updated.
  google.protobuf.Timestamp updated_at = 8;
}

// CreateContactRequest is the request message for the CreateContact RPC.
message CreateContactRequest {
  // The first name of the contact to be created.
  string first_name = 1;
  // The last name of the contact to be created.
  string last_name = 2;
  // The email address of the contact.
  string email = 3;
  // The phone number of the contact.
  string phone = 4;
  // The ID of the user who will own this contact.
  string owner_id = 5;
}

// CreateContactResponse is the response message for the CreateContact RPC.
message CreateContactResponse {
  // The newly created contact.
  Contact contact = 1;
}
